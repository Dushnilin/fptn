name: Build OpenWrt Packages (Multi-Arch)

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build (armsr-armv8, mediatek-filogic, ipq40xx, x86-64, or all)'
        required: true
        default: 'all'
      version:
        description: 'OpenWrt version (25.12.5, 24.10.7, or all)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  build_openwrt:
    name: build (${{ matrix.target }}, ${{ matrix.version }})
    runs-on: ubuntu-latest
    if: >-
      (github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target) &&
      (github.event.inputs.version == null || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version)
    strategy:
      fail-fast: false
      matrix:
        target: [armsr-armv8, mediatek-filogic, ipq40xx, x86-64]
        version: ['25.12.5', '24.10.7']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set package version
        shell: bash
        run: |
          if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref }}" | grep -q 'refs/tags/'; then
            RAW_VER="${{ github.ref_name }}"
            VER="${RAW_VER#v}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.4.6")
            VER="${TAG#v}"
          fi
          echo "FPTN_VERSION=${VER}" >> $GITHUB_ENV
          echo "Building FPTN version: ${VER}"

      - name: Build OpenWrt package with Docker
        shell: bash
        run: |
          docker build \
            --build-arg PKG_VERSION="${FPTN_VERSION}" \
            -t "fptn-openwrt-${{ matrix.target }}-${{ matrix.version }}" \
            -f "./deploy/openwrt/target-${{ matrix.target }}/${{ matrix.version }}/Dockerfile" .

      - name: Extract package
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm -v "$(pwd)/dist:/dst" "fptn-openwrt-${{ matrix.target }}-${{ matrix.version }}" cp -av /out/. /dst/
          ls -la dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.target }}-${{ matrix.version }}
          path: |
            dist/*.apk
            dist/*.ipk
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build_openwrt
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Prepare release files and checksums
        working-directory: release_assets
        run: |
          ls -la
          sha256sum *.apk *.ipk 2>/dev/null > SHA256SUMS || sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.apk
            release_assets/*.ipk
            release_assets/SHA256SUMS
          generate_release_notes: true
