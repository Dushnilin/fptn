name: Watch Upstream

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no upstream changes detected'
        type: boolean
        default: false
      tag:
        description: 'Custom tag override (e.g. v0.4.7)'
        required: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync with upstream and trigger build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check upstream for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git remote add upstream https://github.com/fptn-project/fptn.git 2>/dev/null || git remote set-url upstream https://github.com/fptn-project/fptn.git
          git fetch upstream master --tags

          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/master --count || echo "0")
          echo "Upstream commits ahead: $UPSTREAM_COMMITS"

          # Get latest upstream release tag
          UPSTREAM_TAG=$(gh api repos/fptn-project/fptn/releases --jq '.[0].tag_name' 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(gh api repos/fptn-project/fptn/tags --jq '.[0].name' 2>/dev/null || echo "")
          fi
          echo "Latest upstream release tag: $UPSTREAM_TAG"

          # Current latest GitHub release in our fork
          LOCAL_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[0].tag_name' 2>/dev/null || echo "")
          if [ -z "$LOCAL_TAG" ]; then
            LOCAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.4.6")
          fi
          echo "Current local release tag: $LOCAL_TAG"

          CHANGED="false"
          TARGET_TAG="$LOCAL_TAG"

          if [ -n "${{ inputs.tag }}" ]; then
            TARGET_TAG="${{ inputs.tag }}"
            CHANGED="true"
          elif [ -n "$UPSTREAM_TAG" ]; then
            CLEAN_UPSTREAM="${UPSTREAM_TAG#v}"
            CLEAN_LOCAL="${LOCAL_TAG#v}"
            NEWEST=$(printf '%s\n%s\n' "$CLEAN_LOCAL" "$CLEAN_UPSTREAM" | sort -V | tail -n1)
            if [ "$NEWEST" = "$CLEAN_UPSTREAM" ] && [ "$CLEAN_UPSTREAM" != "$CLEAN_LOCAL" ]; then
              echo "Upstream version $CLEAN_UPSTREAM is newer than local $CLEAN_LOCAL"
              TARGET_TAG="v$CLEAN_UPSTREAM"
              CHANGED="true"
            else
              echo "Local version $CLEAN_LOCAL is already up to date with upstream ($CLEAN_UPSTREAM)"
            fi
          fi

          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "Merging upstream master into master..."
            git merge upstream/master -m "sync: merge upstream fptn-project/fptn changes" || git merge --abort
            CHANGED="true"
          fi

          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "Force release requested."
            CHANGED="true"
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      - name: Push changes and tag if updated
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG="${{ steps.check.outputs.tag }}"

          # Push commits to master
          git push origin master

          # Create tag if it doesn't already exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG" || true

      - name: Trigger build workflow
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          echo "Triggering openwrt.yml workflow in $GITHUB_REPOSITORY for tag $TAG..."
          gh workflow run openwrt.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG" -f publish_release=true
